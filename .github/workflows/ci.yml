name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm install
      - run: npm run build
      - run: npx jest --runInBand
      - name: Install contract test dependencies
        working-directory: .
        run: pip install -r packages/worker/requirements.txt pytest
      - name: Run isolated HTTP/PostgreSQL contract
        working-directory: .
        run: bash scripts/run_mvp_contract.sh

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/worker/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Test contract fake Provider
        working-directory: .
        run: python -m pytest scripts/tests/test_fake_provider.py -q

  comfyui-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/comfyui-video-flow-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/comfyui-video-flow-client/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
